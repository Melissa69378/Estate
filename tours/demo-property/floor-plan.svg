<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="#141c18" rx="16"/>
  <rect width="800" height="600" fill="url(#grid)" rx="16"/>

  <!-- Compass Rose -->
  <g transform="translate(730, 70)" opacity="0.65">
    <circle cx="0" cy="0" r="22" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <polygon points="0,-18 5,-4 0,0 -5,-4" fill="#6ee7b7"/>
    <polygon points="0,18 5,4 0,0 -5,4" fill="rgba(255,255,255,0.3)"/>
    <text x="0" y="-22" fill="#6ee7b7" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">N</text>
  </g>

  <!-- Outer Walls & Blueprint Frame -->
  <g filter="url(#soft-glow)">
    <!-- Main Apartment Outer Walls -->
    <rect x="90" y="80" width="620" height="440" fill="#1a2420" stroke="#374151" stroke-width="2" rx="4"/>
    
    <!-- Terrace Area (bottom left) -->
    <path d="M 90 420 L 290 420 L 290 520 L 90 520 Z" fill="#17211d" stroke="#2d3748" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="190" y="475" fill="#9ca3af" font-family="'DM Sans', sans-serif" font-size="12" text-anchor="middle" letter-spacing="1">TERRACE · 18 m²</text>

    <!-- Living Room (Left-Center) -->
    <rect x="90" y="80" width="310" height="340" fill="#1e2a25" stroke="#4ade80" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="245" y="240" fill="#f3f4f6" font-family="'DM Sans', sans-serif" font-size="15" font-weight="600" text-anchor="middle">LIVING ROOM</text>
    <text x="245" y="260" fill="#9ca3af" font-family="'DM Sans', sans-serif" font-size="12" text-anchor="middle">42.5 m²</text>

    <!-- Kitchen (Top-Left) -->
    <rect x="90" y="80" width="180" height="150" fill="#1a2520" stroke="#4ade80" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="180" y="150" fill="#f3f4f6" font-family="'DM Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle">KITCHEN</text>
    <text x="180" y="170" fill="#9ca3af" font-family="'DM Sans', sans-serif" font-size="11" text-anchor="middle">16.8 m²</text>

    <!-- Master Bedroom (Right) -->
    <rect x="400" y="80" width="310" height="260" fill="#1f2b26" stroke="#4ade80" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="555" y="200" fill="#f3f4f6" font-family="'DM Sans', sans-serif" font-size="15" font-weight="600" text-anchor="middle">MASTER BEDROOM</text>
    <text x="555" y="220" fill="#9ca3af" font-family="'DM Sans', sans-serif" font-size="12" text-anchor="middle">24.2 m²</text>

    <!-- Ensuite Bathroom (Bottom Right) -->
    <rect x="400" y="340" width="310" height="180" fill="#1c2722" stroke="#4ade80" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="555" y="425" fill="#f3f4f6" font-family="'DM Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle">ENSUITE BATHROOM</text>
    <text x="555" y="445" fill="#9ca3af" font-family="'DM Sans', sans-serif" font-size="11" text-anchor="middle">12.6 m²</text>

    <!-- Internal Architectural Walls (Thick Lines) -->
    <path d="M 400 80 L 400 230 M 400 290 L 400 520" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
    <path d="M 400 340 L 710 340" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
    <path d="M 270 80 L 270 230" stroke="#4b5563" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Outer Walls (Heavy Solid Boundary) -->
    <path d="M 90 80 L 710 80 L 710 520 L 290 520 L 290 420 L 90 420 Z" fill="none" stroke="#6b7280" stroke-width="8" stroke-linejoin="round"/>

    <!-- Door Swings -->
    <!-- Entrance to Living Room -->
    <path d="M 400 230 A 60 60 0 0 1 340 290" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="400" y1="230" x2="340" y2="230" stroke="#6ee7b7" stroke-width="2"/>

    <!-- Kitchen Open Arch -->
    <line x1="270" y1="180" x2="270" y2="230" stroke="#9ca3af" stroke-width="2" stroke-dasharray="2,2"/>

    <!-- Master Bedroom to Bathroom Door -->
    <path d="M 480 340 A 50 50 0 0 1 430 390" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="480" y1="340" x2="480" y2="390" stroke="#6ee7b7" stroke-width="2"/>
  </g>

  <!-- Title & Legend -->
  <text x="100" y="555" fill="#f9fafb" font-family="'DM Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">PLAN DU BIEN · NIVEAU PRINCIPAL (114 m²)</text>
  <text x="100" y="575" fill="#9ca3af" font-family="'DM Sans', sans-serif" font-size="11">Cliquez sur une pièce pour afficher le panorama 360°</text>
</svg>
